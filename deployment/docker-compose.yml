services:
  fakessh:
    container_name: fakessh
    image: lbenicio/fakessh:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    ports:
      - "22:22"
      - "2112:2112"
    command: ["--log-file", "/log/fakessh.log"]
    volumes:
      - ../data:/log
    healthcheck:
      test: ["CMD", "/fakessh", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
