version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 25
    commit-message:
      prefix: "build(deps):"
    groups:
      go-non-major:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deployment
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 25
    commit-message:
      prefix: "build(deps):"

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 25
    commit-message:
      prefix: "build(deps):"
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
