name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release and Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Start workflow timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from changelog
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text()
          heading = re.search(
              r"(?m)^## \[((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              r"(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?)\] - "
              r"(\d{4}-\d{2}-\d{2})$",
              changelog,
          )
          if not heading:
              raise SystemExit(
                  "No dated SemVer release heading found in CHANGELOG.md. "
                  "Expected a heading such as '## [0.1.0] - 2026-11-01'."
              )

          version, release_date = heading.groups()
          datetime.date.fromisoformat(release_date)
          print(f"version={version}")
          print(f"tag=v{version}")
          print(f"release_date={release_date}")
          PY

      - name: Check branch and prevent duplicate release
        id: duplicate_check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow on the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

          check_absent() {
            local path="$1"
            local description="$2"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$path")

            if [[ "$status" == "200" ]]; then
              echo "::error::$description already exists for $TAG; refusing to publish it again."
              exit 1
            elif [[ "$status" != "404" ]]; then
              echo "::error::Could not check $description for $TAG (GitHub API returned HTTP $status)."
              exit 1
            fi
          }

          check_absent "releases/tags/$TAG" "A GitHub release"
          check_absent "git/ref/tags/$TAG" "A Git tag"

          docker_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/lbenicio/fakessh/tags/$VERSION")
          if [[ "$docker_status" == "200" ]]; then
            echo "::error::Docker Hub tag $VERSION already exists; refusing to overwrite it."
            exit 1
          elif [[ "$docker_status" != "404" ]]; then
            echo "::error::Could not check the Docker Hub tag (HTTP $docker_status)."
            exit 1
          fi
          echo "Version $TAG is not published and its tag is available."

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure the DOCKERHUB_USERNAME repository variable and DOCKERHUB_TOKEN secret.'
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lbenicio/fakessh:${{ steps.version.outputs.version }}
            lbenicio/fakessh:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "FakeSSH $RELEASE_TAG" \
            --generate-notes

      - name: Write workflow summary
        if: always()
        env:
          STARTED_AT: ${{ steps.timer.outputs.started_at }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DATE: ${{ steps.version.outputs.release_date }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          DUPLICATE_CHECK: ${{ steps.duplicate_check.outcome }}
          DOCKER_BUILD: ${{ steps.docker_build.outcome }}
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
          GITHUB_RELEASE: ${{ steps.github_release.outcome }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        shell: bash
        run: |
          started_at="${STARTED_AT:-$(date +%s)}"
          elapsed_seconds=$(($(date +%s) - started_at))
          ref_name="${REF_NAME//|/\\|}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🚀 Release workflow summary

          | Workflow detail | Value |
          | --- | --- |
          | Run | [#${RUN_NUMBER}](${RUN_URL}) |
          | Source ref | \`${ref_name}\` (default: \`${DEFAULT_BRANCH}\`) |
          | Commit | [\`${COMMIT_SHA:0:7}\`](${COMMIT_URL}) |
          | Release | ${RELEASE_TAG:-not resolved} (${RELEASE_DATE:-no changelog date}) |
          | Version | ${RELEASE_VERSION:-not resolved} |
          | Elapsed | ${elapsed_seconds}s |

          ### Publish results

          | Operation | Result |
          | --- | --- |
          | Duplicate version check | ${DUPLICATE_CHECK:-not run} |
          | Docker image | ${DOCKER_BUILD:-not run} |
          | GitHub release | ${GITHUB_RELEASE:-not run} |

          ### Docker image

          | Metric | Value |
          | --- | --- |
          | Image | \`lbenicio/fakessh:${RELEASE_VERSION:-version}\` |
          | Additional tag | \`lbenicio/fakessh:latest\` |
          | Platforms | \`linux/amd64\`, \`linux/arm64\` |
          | Image digest | \`${IMAGE_DIGEST:-not available}\` |
          EOF
