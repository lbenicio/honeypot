name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.timer.outputs.started_at }}
      duration_seconds: ${{ steps.build.outputs.duration_seconds }}
      go_version: ${{ steps.go_version.outputs.version }}
    steps:
      - name: Start job timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record Go version
        id: go_version
        run: echo "version=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          make build
          status=$?
          set -e
          echo "duration_seconds=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
          exit "$status"

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.timer.outputs.started_at }}
      duration_seconds: ${{ steps.lint.outputs.duration_seconds }}
    steps:
      - name: Start job timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.15.0
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting and lint
        id: lint
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          make lint
          status=$?
          set -e
          echo "duration_seconds=$(($(date +%s) - started_at))" >> "$GITHUB_OUTPUT"
          exit "$status"

  test:
    name: Run tests and generate reports
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.timer.outputs.started_at }}
      duration_seconds: ${{ steps.test.outputs.duration_seconds }}
      passed: ${{ steps.test.outputs.passed }}
      failed: ${{ steps.test.outputs.failed }}
      skipped: ${{ steps.test.outputs.skipped }}
      coverage_percent: ${{ steps.test.outputs.coverage_percent }}
      coverage_available: ${{ steps.test.outputs.coverage_available }}
      test_results_available: ${{ steps.test.outputs.test_results_available }}
      coverage_artifact_outcome: ${{ steps.coverage_artifact.outcome }}
    steps:
      - name: Start job timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install gotestsum
        env:
          GOTESTSUM_VERSION: v1.13.0
        run: |
          go install gotest.tools/gotestsum@"$GOTESTSUM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        id: test
        shell: bash
        run: |
          started_at=$(date +%s)
          set +e
          gotestsum --junitfile=test-results.xml --format=standard-verbose -- -coverprofile=coverage.out -covermode=atomic -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          status=${PIPESTATUS[0]}
          set -e

          coverage_percent="unavailable"
          coverage_available=false
          test_results_available=false
          if [[ -f coverage.out ]]; then
            coverage_available=true
            coverage_percent=$(go tool cover -func=coverage.out 2>/dev/null | awk '$1 == "total:" {print $3}' || true)
            coverage_percent="${coverage_percent:-unavailable}"
          fi
          if [[ -s test-results.xml ]]; then
            test_results_available=true
          fi

          if [[ "$status" -eq 0 ]]; then
            if ! awk '/coverage: [0-9.]+% of statements/ { found = 1; for (field = 1; field <= NF; field++) if ($field == "coverage:") { coverage = $(field + 1); sub(/%$/, "", coverage); if ((coverage + 0) <= 98) { printf "Package coverage is %s%%; it must be greater than 98%%.\n", coverage > "/dev/stderr"; failed = 1 } } } END { if (!found || failed) exit 1 }' "$RUNNER_TEMP/go-test.log"; then
              echo "Every Go package must report more than 98% statement coverage." >&2
              status=1
            fi
          fi

          {
            echo "duration_seconds=$(($(date +%s) - started_at))"
            echo "passed=$(grep -c '^--- PASS:' "$RUNNER_TEMP/go-test.log" || true)"
            echo "failed=$(grep -c '^--- FAIL:' "$RUNNER_TEMP/go-test.log" || true)"
            echo "skipped=$(grep -c '^--- SKIP:' "$RUNNER_TEMP/go-test.log" || true)"
            echo "coverage_percent=$coverage_percent"
            echo "coverage_available=$coverage_available"
            echo "test_results_available=$test_results_available"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload coverage artifact
        id: coverage_artifact
        if: always() && (hashFiles('coverage.out') != '' || hashFiles('test-results.xml') != '')
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: go-coverage
          path: |
            coverage.out
            test-results.xml
          if-no-files-found: error
          retention-days: 1

  codecov:
    name: Publish coverage and test results to Codecov
    if: always() && (needs.test.outputs.coverage_available == 'true' || needs.test.outputs.test_results_available == 'true')
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.timer.outputs.started_at }}
      duration_seconds: ${{ steps.duration.outputs.duration_seconds }}
      upload_outcome: ${{ steps.codecov_upload.outcome }}
      test_results_upload_outcome: ${{ steps.test_results_upload.outcome }}
    steps:
      - name: Start job timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v6

      - name: Download coverage artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: go-coverage
          path: coverage

      - name: Validate coverage profile paths
        if: needs.test.outputs.coverage_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          profile=coverage/coverage.out
          if [[ ! -s "$profile" ]] || [[ "$(head -n 1 "$profile")" != "mode: atomic" ]]; then
            echo "::error::The downloaded Go coverage profile is missing or invalid."
            exit 1
          fi

          mapfile -t source_files < <(awk 'NR > 1 { sub(/:[0-9].*/, "", $1); print $1 }' "$profile" | sort -u)
          if ((${#source_files[@]} == 0)); then
            echo "::error::The Go coverage profile contains no source files."
            exit 1
          fi

          for source_file in "${source_files[@]}"; do
            repository_path="${source_file#github.com/lbenicio/fakessh/}"
            if [[ "$repository_path" == "$source_file" || ! -f "$repository_path" ]]; then
              echo "::error::Coverage path does not map to a checked-out source file: $source_file"
              exit 1
            fi
          done
          echo "Validated ${#source_files[@]} source files in the coverage profile."

      - name: Upload coverage to Codecov
        id: codecov_upload
        if: needs.test.outputs.coverage_available == 'true'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/coverage.out
          report_type: coverage
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        id: test_results_upload
        if: ${{ !cancelled() && needs.test.outputs.test_results_available == 'true' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/test-results.xml
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Record Codecov job duration
        id: duration
        if: always()
        env:
          STARTED_AT: ${{ steps.timer.outputs.started_at }}
        shell: bash
        run: echo "duration_seconds=$(($(date +%s) - STARTED_AT))" >> "$GITHUB_OUTPUT"

  summary:
    name: Workflow summary
    if: always()
    needs: [build, lint, test, codecov]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        env:
          BUILD_STATUS: ${{ needs.build.result }}
          BUILD_STARTED_AT: ${{ needs.build.outputs.started_at }}
          BUILD_SECONDS: ${{ needs.build.outputs.duration_seconds }}
          LINT_STATUS: ${{ needs.lint.result }}
          LINT_STARTED_AT: ${{ needs.lint.outputs.started_at }}
          LINT_SECONDS: ${{ needs.lint.outputs.duration_seconds }}
          TEST_STATUS: ${{ needs.test.result }}
          TEST_STARTED_AT: ${{ needs.test.outputs.started_at }}
          TEST_SECONDS: ${{ needs.test.outputs.duration_seconds }}
          TEST_PASSED: ${{ needs.test.outputs.passed }}
          TEST_FAILED: ${{ needs.test.outputs.failed }}
          TEST_SKIPPED: ${{ needs.test.outputs.skipped }}
          COVERAGE_PERCENT: ${{ needs.test.outputs.coverage_percent }}
          COVERAGE_ARTIFACT_OUTCOME: ${{ needs.test.outputs.coverage_artifact_outcome }}
          CODECOV_JOB_STATUS: ${{ needs.codecov.result }}
          CODECOV_STARTED_AT: ${{ needs.codecov.outputs.started_at }}
          CODECOV_SECONDS: ${{ needs.codecov.outputs.duration_seconds }}
          CODECOV_UPLOAD_OUTCOME: ${{ needs.codecov.outputs.upload_outcome }}
          CODECOV_TEST_RESULTS_OUTCOME: ${{ needs.codecov.outputs.test_results_upload_outcome }}
          GO_VERSION: ${{ needs.build.outputs.go_version }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        shell: bash
        run: |
          started_at=""
          for value in "$BUILD_STARTED_AT" "$LINT_STARTED_AT" "$TEST_STARTED_AT" "$CODECOV_STARTED_AT"; do
            if [[ "$value" =~ ^[0-9]+$ ]] && { [[ -z "$started_at" ]] || ((value < started_at)); }; then
              started_at="$value"
            fi
          done
          started_at="${started_at:-$(date +%s)}"
          elapsed_seconds=$(($(date +%s) - started_at))
          ref_name="${REF_NAME//|/\\|}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🧪 ${WORKFLOW_NAME}

          | Workflow detail | Value |
          | --- | --- |
          | Run | [#${RUN_NUMBER}](${RUN_URL}) |
          | Trigger | ${EVENT_NAME} |
          | Ref | \`${ref_name}\` |
          | Commit | [\`${COMMIT_SHA:0:7}\`](${COMMIT_URL}) |
          | Go | ${GO_VERSION:-not set up} |
          | Elapsed | ${elapsed_seconds}s |

          ### Results

          | Job | Result | Duration |
          | --- | --- | ---: |
          | Build binary | ${BUILD_STATUS:-not run} | ${BUILD_SECONDS:-—}s |
          | Format and lint | ${LINT_STATUS:-not run} | ${LINT_SECONDS:-—}s |
          | Run tests and generate reports | ${TEST_STATUS:-not run} | ${TEST_SECONDS:-—}s |
          | Test and coverage report artifacts | ${COVERAGE_ARTIFACT_OUTCOME:-not run} | — |
          | Publish coverage to Codecov | ${CODECOV_UPLOAD_OUTCOME:-${CODECOV_JOB_STATUS:-not run}} | ${CODECOV_SECONDS:-—}s |
          | Publish test results to Codecov | ${CODECOV_TEST_RESULTS_OUTCOME:-${CODECOV_JOB_STATUS:-not run}} | — |

          ### Test cases

          | Passed | Failed | Skipped |
          | ---: | ---: | ---: |
          | ${TEST_PASSED:-0} | ${TEST_FAILED:-0} | ${TEST_SKIPPED:-0} |

          Coverage: **${COVERAGE_PERCENT:-unavailable}**
          EOF
